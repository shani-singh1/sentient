site_name: Sentient - Bengaluru Road Risk Intelligence
site_description: End-to-end pipeline and product documentation for Bengaluru road risk prediction from satellite signals.
repo_name: sentient
theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.tabs.link
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: indigo
      accent: cyan

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - tables

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Setup: setup.md
  - Pipeline: pipeline.md
  - Data Contracts: data-contracts.md
  - API: api.md
  - Frontend: frontend.md
  - Operations: operations.md
